openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: FlowPilot REST API
  version: 1.5.0
  license:
    name: Proprietary - Internal Use Only
    identifier: LicenseRef-Proprietary
  description: |
    FlowPilot 内网流程平台首版 REST API 契约。

    所有写操作由后端重新执行权限、状态与版本校验。可变资源使用整数
    `revision` 生成强 ETag；要求 `If-Match` 的接口在缺少请求头时返回 428，
    在版本过期时返回 412。创建及领域命令要求 `Idempotency-Key`，同一用户、
    路由作用域和键的相同请求会重放首次结果，不同请求体会返回 409。

    日期时间均为 ISO-8601 UTC。业务实体 ID 均由后端生成。审批、确认、字段
    修改、任务激活、流程状态、审计与邮件 Outbox 必须在同一业务事务中提交；
    SMTP 发送在事务提交后异步执行。Excel 文件只在浏览器中根据后端返回的
    已鉴权导出数据集生成，后端不生成、不保存 Excel 文件。

    浏览器原型的 MSW 适配层可以在独立 Mock 地址使用演示 Bearer；该方案不属于
    本正式契约。正式后端只使用 HttpOnly 会话 Cookie。
servers:
  - url: /api/flowpilot/v1
    description: 与前端同源部署的内网 API
security:
  - cookieAuth: []
x-flowpilot-concurrency-policy:
  storage: SQL Server 2016 SP2 及之后版本的单后端实例，数据库兼容级别不低于 130；写命令使用短显式事务，发布、实例创建、任务决策和编号分配按场景使用 SERIALIZABLE、UPDLOCK/HOLDLOCK 或等价仓储事务
  optimisticLocking: 可变聚合以 revision 生成强 ETag；If-Match 缺失返回 428，过期返回 412
  taskFirstWriterWins: 待办以 status=pending 且 revision 匹配的条件更新实现，未更新到行时返回 TASK_ALREADY_COMPLETED
  fieldLevelConcurrency: 审批和重复修改只 patch 授权字段，并比较 touched field 的 baseFieldRevisions
  idempotency: 按 actorId、routeScope、Idempotency-Key 和请求摘要持久化；相同请求重放，不同请求返回 IDEMPOTENCY_KEY_REUSED
  outbox: 业务事务只写待发送事件；SMTP 在提交后异步处理
tags:
  - name: System
    description: 存活、就绪和受保护的运维状态
  - name: Authentication
    description: 登录会话与当前身份
  - name: Users
    description: 用户账号治理
  - name: Organization
    description: 部门与职务字典
  - name: Roles
    description: 系统角色及权限矩阵
  - name: WorkflowPermissionGroups
    description: 流程权限组及动态有效成员
  - name: ProcessDefinitions
    description: 稳定流程定义与版本家族
  - name: ProcessVersions
    description: 完整版本快照、校验与发布指针
  - name: ProcessInstances
    description: 流程实例创建、查询与发起方命令
  - name: WorkflowTasks
    description: 审批、确认与重复字段修改
  - name: FreeCollaboration
    description: 自由协作回复、转交、改派和重开
  - name: Attachments
    description: 暂存文件、元数据与受控下载
  - name: EmailOutbox
    description: 邮件 Outbox 运维与失败重试
  - name: Audit
    description: 不可变操作审计
  - name: Exports
    description: 返回当前查询范围内已鉴权的数据集，由浏览器生成 Excel

paths:
  /health/live:
    get:
      tags: [System]
      operationId: getLiveness
      summary: 检查 API 进程是否可以响应
      description: 不访问数据库、AD、SMTP 或附件磁盘，也不返回内部地址和配置。
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessDto"
        "400":
          description: 请求语法或 Host 等请求边界校验失败；请求未进入健康检查处理器
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /health/ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: 检查服务是否可以接收正式业务请求
      description: 检查配置、SQL Server 连接、兼容级别、schema 和迁移版本；不返回秘密、连接字符串或内部地址。
      security: []
      responses:
        "200":
          description: 服务就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessDto"
        "503":
          description: 服务尚未就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessDto"
        "400":
          description: 请求语法或 Host 等请求边界校验失败；请求未进入健康检查处理器
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /health/details:
    get:
      tags: [System]
      operationId: getOperationalHealthDetails
      summary: 获取受权限保护的详细运维状态
      description: 仅具有系统运维查看权限的用户可访问。当前后端切片返回数据库、schema、AD/LDAP 和 SMTP 的脱敏状态；附件磁盘、后台任务、清理和死信状态随对应后端模块实现后加入。
      responses:
        "200":
          description: 详细运维状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalHealthDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: 登录并建立会话
      description: 后端根据用户记录中的 authenticationMode 选择域认证或本地密码认证；客户端不能指定认证方式。域服务不可用时不得回退本地密码。即使尚未登录，本写请求也必须通过 Origin/Referer 同源校验，拒绝登录 CSRF。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: 注销当前会话
      description: 必须通过 Origin/Referer 同源校验；无论服务端会话是否仍存在，成功响应都清除同一路径的会话 Cookie。
      responses:
        "204":
          description: 已注销
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearSessionCookie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentSession
      summary: 获取当前用户、角色和有效权限
      responses:
        "200":
          description: 当前会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDto"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/impersonation/candidates:
    get:
      tags: [Authentication]
      operationId: listImpersonationCandidates
      summary: 查询允许被模拟的启用用户
      description: 仅真实登录操作者为系统内置超级管理员时可用；权限判断不能使用当前模拟用户。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: 可模拟用户分页结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/impersonation:
    post:
      tags: [Authentication]
      operationId: startImpersonation
      summary: 以指定用户身份继续当前会话
      description: 仅真实登录的系统内置超级管理员可执行。该命令跳过目标用户的域或本地密码认证，不接收目标凭据，直接返回目标身份已生效的会话；后续权限和数据范围按目标用户计算，审计同时记录真实操作者和生效用户。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartImpersonationRequest"
      responses:
        "200":
          description: 模拟身份已生效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Authentication]
      operationId: stopImpersonation
      summary: 结束模拟身份并恢复真实操作者
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 已恢复真实操作者身份
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: 分页查询用户
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EnabledStatus"
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
        - name: positionId
          in: query
          schema:
            type: string
            format: uuid
        - name: roleId
          in: query
          schema:
            type: string
            format: uuid
        - name: hasEmail
          in: query
          description: 收件人选择器可只查询已维护邮箱的用户
          schema:
            type: boolean
        - name: authenticationMode
          in: query
          schema:
            $ref: "#/components/schemas/AuthenticationMode"
      responses:
        "200":
          description: 用户分页结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Users]
      operationId: createUser
      summary: 创建用户
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: 用户已创建
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      operationId: getUser
      summary: 获取用户详情
      responses:
        "200":
          description: 用户详情
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Users]
      operationId: updateUser
      summary: 修改用户资料、登录方式、部门、职务和角色
      description: 超级管理员账号不可修改。账号状态由专用命令修改；切换为密码登录时必须在同一请求中设置新密码，切换为域登录时清除本地密码散列并使现存会话失效。
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: 用户已更新
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: 删除无引用的非内置用户
      description: 使用独立用户删除权限。删除前检查角色、流程权限组、流程版本、实例、任务、附件和其他历史业务引用；当前登录账号、超级管理员及任何仍被引用的用户不可删除。成功后使该用户全部会话失效。
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: 用户已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /users/{userId}/status:
    put:
      tags: [Users]
      operationId: setUserStatus
      summary: 显式启用或停用用户
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStatusRequest"
      responses:
        "200":
          description: 状态已更新
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /users/{userId}/reset-password:
    post:
      tags: [Users]
      operationId: resetUserPassword
      summary: 管理员重置用户密码
      description: 只允许密码登录用户；域登录用户返回 AUTHENTICATION_MODE_CONFLICT。
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: 密码已重置
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /departments:
    get:
      tags: [Organization]
      operationId: listDepartments
      summary: 获取最多两级的部门树
      parameters:
        - name: includeDisabled
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 部门树
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Organization]
      operationId: createDepartment
      summary: 创建部门
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDepartmentRequest"
      responses:
        "201":
          description: 部门已创建
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /departments/{departmentId}:
    parameters:
      - $ref: "#/components/parameters/DepartmentId"
    patch:
      tags: [Organization]
      operationId: updateDepartment
      summary: 修改部门
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDepartmentRequest"
      responses:
        "200":
          description: 部门已更新
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      tags: [Organization]
      operationId: deleteDepartment
      summary: 删除未被用户引用且无子部门的部门
      description: 使用独立的部门管理删除权限；普通编辑权限不能执行删除。
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: 部门已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /positions:
    get:
      tags: [Organization]
      operationId: listPositions
      summary: 分页查询全局职务字典
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EnabledStatus"
      responses:
        "200":
          description: 职务分页结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Organization]
      operationId: createPosition
      summary: 创建职务
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPositionRequest"
      responses:
        "201":
          description: 职务已创建
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /positions/{positionId}:
    parameters:
      - $ref: "#/components/parameters/PositionId"
    patch:
      tags: [Organization]
      operationId: updatePosition
      summary: 修改、排序或启停职务
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePositionRequest"
      responses:
        "200":
          description: 职务已更新
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
