            $ref: "#/components/schemas/ProcessInstanceStatus"
        - name: initiatorId
          in: query
          schema:
            type: string
            format: uuid
        - name: activeOnly
          in: query
          description: 为 true 时仅返回尚未完成或关闭的实例，供“我的发起”分页使用
