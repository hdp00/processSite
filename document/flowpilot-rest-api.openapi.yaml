openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: FlowPilot REST API
  version: 1.0.0
  description: |
    FlowPilot 内网流程平台首版 REST API 契约。

    所有写操作由后端重新执行权限、状态与版本校验。可变资源使用整数
    `revision` 生成强 ETag；要求 `If-Match` 的接口在缺少请求头时返回 428，
    在版本过期时返回 412。创建及领域命令要求 `Idempotency-Key`，同一用户、
    路由作用域和键的相同请求会重放首次结果，不同请求体会返回 409。

    日期时间均为 ISO-8601 UTC。业务实体 ID 均由后端生成。审批、确认、字段
    修改、任务激活、流程状态、审计与邮件 Outbox 必须在同一业务事务中提交；
    SMTP 发送和 Excel 文件生成在事务提交后异步执行。

    浏览器原型的 MSW 适配层可使用 `Authorization: Bearer mock:<userId>`；
    正式后端应使用 HttpOnly 会话 Cookie，并移除该演示认证方案。
servers:
  - url: /api/v1
    description: 与前端同源部署的内网 API
security:
  - cookieAuth: []
  - mockBearerAuth: []
x-flowpilot-concurrency-policy:
  storage: SQLite 单后端实例，写命令使用短事务；发布、实例创建、任务决策和编号分配使用 BEGIN IMMEDIATE 或等价仓储事务
  optimisticLocking: 可变聚合以 revision 生成强 ETag；If-Match 缺失返回 428，过期返回 412
  taskFirstWriterWins: 待办以 status=pending 且 revision 匹配的条件更新实现，未更新到行时返回 TASK_ALREADY_COMPLETED
  fieldLevelConcurrency: 审批和重复修改只 patch 授权字段，并比较 touched field 的 baseFieldRevisions
  idempotency: 按 actorId、routeScope、Idempotency-Key 和请求摘要持久化；相同请求重放，不同请求返回 IDEMPOTENCY_KEY_REUSED
  outbox: 业务事务只写待发送事件；SMTP 与 Excel 生成均在提交后异步处理
tags:
  - name: Authentication
    description: 登录会话与当前身份
  - name: Users
    description: 用户账号治理
  - name: Organization
    description: 部门与职务字典
  - name: Roles
    description: 系统角色及权限矩阵
  - name: WorkflowPermissionGroups
    description: 流程权限组及动态有效成员
  - name: ProcessDefinitions
    description: 稳定流程定义与版本家族
  - name: ProcessVersions
    description: 完整版本快照、校验与发布指针
  - name: ProcessInstances
    description: 流程实例创建、查询与发起方命令
  - name: WorkflowTasks
    description: 审批、确认与重复字段修改
  - name: FreeCollaboration
    description: 自由协作回复、转交、改派和重开
  - name: Attachments
    description: 暂存文件、元数据与受控下载
  - name: EmailOutbox
    description: 邮件 Outbox 运维与失败重试
  - name: Audit
    description: 不可变操作审计
  - name: Exports
    description: 当前查询范围的异步 Excel 导出

paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: 登录并建立会话
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: 注销当前会话
      responses:
        "204":
          description: 已注销
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentSession
      summary: 获取当前用户、角色和有效权限
      responses:
        "200":
          description: 当前会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDto"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: 分页查询用户
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EnabledStatus"
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
        - name: positionId
          in: query
          schema:
            type: string
            format: uuid
        - name: roleId
          in: query
          schema:
            type: string
            format: uuid
        - name: hasEmail
          in: query
          description: 收件人选择器可只查询已维护邮箱的用户
          schema:
            type: boolean
      responses:
        "200":
          description: 用户分页结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Users]
      operationId: createUser
      summary: 创建用户
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: 用户已创建
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      operationId: getUser
      summary: 获取用户详情
      responses:
        "200":
          description: 用户详情
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Users]
      operationId: updateUser
      summary: 修改用户资料、部门、职务和角色
      description: 超级管理员账号不可修改。账号状态和密码由专用命令修改。
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: 用户已更新
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /users/{userId}/status:
    put:
      tags: [Users]
      operationId: setUserStatus
      summary: 显式启用或停用用户
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStatusRequest"
      responses:
        "200":
          description: 状态已更新
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /users/{userId}/reset-password:
    post:
      tags: [Users]
      operationId: resetUserPassword
      summary: 管理员重置用户密码
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: 密码已重置
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /departments:
    get:
      tags: [Organization]
      operationId: listDepartments
      summary: 获取最多两级的部门树
      parameters:
        - name: includeDisabled
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 部门树
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Organization]
      operationId: createDepartment
      summary: 创建部门
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDepartmentRequest"
      responses:
        "201":
          description: 部门已创建
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /departments/{departmentId}:
    parameters:
      - $ref: "#/components/parameters/DepartmentId"
    patch:
      tags: [Organization]
      operationId: updateDepartment
      summary: 修改部门
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDepartmentRequest"
      responses:
        "200":
          description: 部门已更新
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      tags: [Organization]
      operationId: deleteDepartment
      summary: 删除未被用户引用且无子部门的部门
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: 部门已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /positions:
    get:
      tags: [Organization]
      operationId: listPositions
      summary: 分页查询全局职务字典
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EnabledStatus"
      responses:
        "200":
          description: 职务分页结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Organization]
      operationId: createPosition
      summary: 创建职务
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPositionRequest"
      responses:
        "201":
          description: 职务已创建
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /positions/{positionId}:
    parameters:
      - $ref: "#/components/parameters/PositionId"
    patch:
      tags: [Organization]
      operationId: updatePosition
      summary: 修改、排序或启停职务
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPositionRequest"
      responses:
        "200":
          description: 职务已更新
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      tags: [Organization]
      operationId: deletePosition
      summary: 删除未被用户引用的职务
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: 职务已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: 分页查询系统角色
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EnabledStatus"
      responses:
        "200":
          description: 角色分页结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Roles]
      operationId: createRole
      summary: 创建系统角色
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: 角色已创建，默认无权限
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /roles/{roleId}:
    parameters:
      - $ref: "#/components/parameters/RoleId"
    get:
      tags: [Roles]
      operationId: getRole
      summary: 获取角色及成员
      responses:
        "200":
          description: 角色详情
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Roles]
      operationId: updateRole
      summary: 修改角色名称、说明、成员和状态
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: 角色已更新
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      tags: [Roles]
      operationId: deleteRole
      summary: 删除非内置且未被流程权限组引用的角色
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: 角色已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /permissions:
    get:
      tags: [Roles]
      operationId: listPermissions
      summary: 获取页面与动作权限目录
      responses:
        "200":
          description: 权限目录
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /roles/{roleId}/permissions:
    get:
      tags: [Roles]
      operationId: getRolePermissions
      summary: 获取角色权限矩阵
      parameters:
        - $ref: "#/components/parameters/RoleId"
      responses:
        "200":
          description: 角色权限
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePermissionsDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Roles]
      operationId: replaceRolePermissions
      summary: 原子替换角色权限集合
      parameters:
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRolePermissionsRequest"
      responses:
        "200":
          description: 权限已保存
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePermissionsDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /roles/{roleId}/change-impact:
    post:
      tags: [Roles]
      operationId: previewRoleChangeImpact
      summary: 预览角色成员或状态变更对流程资格和运行待办的影响
      description: 只读计算，不写入角色或流程权限组。
      parameters:
        - $ref: "#/components/parameters/RoleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleChangeImpactRequest"
      responses:
        "200":
          description: 变更影响
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowGroupChangeImpactDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
