  /attachments/{attachmentId}/content:
    get:
      tags: [Attachments]
      operationId: downloadAttachment
      summary: 按实例数据范围校验后下载或内联预览附件
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
        - $ref: "#/components/parameters/Range"
        - name: disposition
          in: query
          schema:
            type: string
            enum: [inline, attachment]
            default: attachment
      responses:
        "200":
          description: 附件二进制内容
          headers:
            Accept-Ranges:
              description: 首版仅支持 bytes 单区间
              schema:
                type: string
                const: bytes
            Content-Length:
              schema:
                type: integer
                minimum: 0
            Content-Disposition:
              description: 安全编码后的原始文件名
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "206":
          description: 合法单区间附件内容
          headers:
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Content-Range:
              description: 实际返回的字节区间和完整长度
              schema:
                type: string
                example: bytes 0-1023/4096
            Content-Length:
              schema:
                type: integer
                minimum: 1
            Content-Disposition:
              description: 安全编码后的原始文件名
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
