  /workflow-tasks/{taskId}/decision:
    post:
      tags: [WorkflowTasks]
      operationId: decideWorkflowTask
      summary: 提交通过、确认或驳回结果
      description: |
        仅接受 taskType=approval；自由协作和待重新提交任务调用本端点返回 409。
        以条件更新保证默认责任人与代办人员并发时首个成功提交生效。确认节点只接受
        confirm；审批节点接受 pass/reject。授权字段修改、结果、实际处理人、后续激活、
        并行取消、实例状态、时间线和 Outbox 原子保存。
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDecisionRequest"
      responses:
        "200":
          description: 任务处理成功
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDecisionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /workflow-tasks/{taskId}/field-revisions:
    post:
      tags: [WorkflowTasks]
      operationId: reviseCompletedWorkflowTaskFields
      summary: 在不改变原审核结果的前提下继续修改授权字段
      description: |
        仅接受 taskType=approval；自由协作和待重新提交任务调用本端点返回 409。
        只允许原实际处理人或超级管理员；节点必须开启重复修改，原结果必须为通过或
        确认，实例不得处于驳回待处理或已关闭。每次请求追加一条不可变差异记录，不
        重复生成审核记录，也不反向重算已激活、跳过或完成的节点。
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviseTaskFieldsRequest"
      responses:
