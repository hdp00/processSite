components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: flowpilot_session
      description: 正式同源 HttpOnly 会话 Cookie，Path=/api/flowpilot；当前 HTTP 环境 Secure=false，启用 HTTPS 后必须为 true

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Search:
      name: q
      in: query
      description: 去除首尾空格的关键词
      schema:
        type: string
        maxLength: 100
    DateFrom:
      name: dateFrom
      in: query
      required: true
      description: 查询起始日期，前端默认今天之前 30 天
      schema:
        type: string
        format: date
    DateTo:
      name: dateTo
      in: query
      required: true
      description: 查询结束日期，前端默认今天；不得早于 dateFrom
      schema:
        type: string
        format: date
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: GET 返回的强 ETag，例如 `"12"`
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 客户端生成的 UUID；同作用域至少保留 24 小时
      schema:
        type: string
        minLength: 16
        maxLength: 100
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PositionId:
      name: positionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkflowGroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DefinitionId:
      name: definitionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TimelineEntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Range:
      name: Range
      in: header
      required: false
      description: RFC 9110 bytes 单区间，例如 `bytes=0-1023`；首版拒绝多区间
      schema:
        type: string
        pattern: '^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$'
    OutboxMessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditEventId:
      name: auditEventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    ETag:
      description: 由资源 revision 生成的强 ETag
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    SetSessionCookie:
      description: 设置 `flowpilot_session` HttpOnly、SameSite=Strict 会话 Cookie，Path 固定为 `/api/flowpilot`；当前 HTTP 部署不设置 Secure，启用 HTTPS 后由配置设置 Secure。
      schema:
        type: string
    ClearSessionCookie:
      description: 使用与登录相同的 Cookie 名称和 Path，并通过过期时间或 Max-Age=0 清除 `flowpilot_session`。
      schema:
        type: string

  responses:
    BadRequest:
      description: 请求语法、查询范围或媒体格式参数错误
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: 未登录或会话失效
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: 缺少页面/动作权限、流程资格或数据范围
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: 资源不存在，或为避免越权信息泄露而按不存在处理
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: 当前领域状态不允许该动作、幂等键冲突或字段并发冲突
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PreconditionFailed:
      description: If-Match 已过期
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    UnprocessableEntity:
      description: 领域字段校验未通过
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PreconditionRequired:
      description: 缺少必需的 If-Match
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    TooManyRequests:
      description: 请求过于频繁
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ServiceUnavailable:
      description: 域认证等必需外部依赖当前不可用
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PayloadTooLarge:
      description: 文件超过字段或系统限制
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    UnsupportedMediaType:
      description: 文件内容类型不受支持
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    RangeNotSatisfiable:
      description: Range 无效、超出文件范围或包含首版不支持的多区间
      headers:
        Content-Range:
          description: 使用 `bytes */{完整长度}` 返回可用长度
          schema:
            type: string
            example: bytes */4096
        Accept-Ranges:
          schema:
            type: string
            const: bytes
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InsufficientStorage:
      description: 附件卷无法在满足配置保留空间的前提下接受本次上传
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    SavedProcessVersion:
      description: 版本分区已保存并自动重新校验
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SaveProcessVersionResponse"

  schemas:
    HealthState:
      type: string
      enum: [ok, degraded, unavailable]
    LivenessDto:
      type: object
      additionalProperties: false
      required: [status, checkedAt]
      properties:
        status:
          type: string
          const: ok
        checkedAt:
          type: string
          format: date-time
    ReadinessDto:
      type: object
      additionalProperties: false
      required: [status, checkedAt, version]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checkedAt:
          type: string
          format: date-time
        version:
          type: string
          description: 不包含源代码路径或构建机信息的应用版本
        code:
          type: string
          description: 未就绪时的稳定原因代码，例如 DATABASE_UNAVAILABLE 或 SCHEMA_VERSION_MISMATCH
    OperationalHealthCheckDto:
      type: object
      additionalProperties: false
      required: [name, status, checkedAt]
      properties:
        name:
          type: string
          enum: [database, schema, domain-auth, smtp, attachment-storage, attachment-cleanup, email-outbox, scheduler]
        status:
          $ref: "#/components/schemas/HealthState"
        checkedAt:
          type: string
          format: date-time
        code:
          type: string
          description: 脱敏稳定状态代码
        message:
          type: string
          maxLength: 500
          description: 不包含密码、令牌、连接字符串、内部绝对路径或完整服务器响应
        metrics:
          type: object
          additionalProperties:
            type: [string, number, boolean, "null"]
          description: 允许显示的计数、剩余空间和最近成功时间等脱敏指标
    OperationalHealthDto:
      type: object
      additionalProperties: false
      required: [status, checkedAt, version, checks]
      properties:
        status:
          $ref: "#/components/schemas/HealthState"
        checkedAt:
          type: string
          format: date-time
        version:
          type: string
        checks:
          type: array
          items:
            $ref: "#/components/schemas/OperationalHealthCheckDto"
    ProblemDetails:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
          example: /problems/task-already-completed
        title:
          type: string
          example: 任务已处理
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          $ref: "#/components/schemas/ProblemCode"
        traceId:
          type: string
        currentEtag:
          type: string
        retryAfterSeconds:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssueDto"
        currentResource:
          description: 冲突处理所需的最小当前资源快照
          type: object
          additionalProperties: true
    ProblemCode:
      type: string
      enum:
        - BAD_REQUEST
        - AUTHENTICATION_REQUIRED
        - INVALID_CREDENTIALS
        - CSRF_VALIDATION_FAILED
        - PERMISSION_DENIED
        - DATA_SCOPE_DENIED
        - RESOURCE_NOT_FOUND
        - REVISION_MISMATCH
        - VALIDATION_FAILED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_REQUEST_IN_PROGRESS
        - IMMUTABLE_BUILTIN_RESOURCE
        - RESOURCE_IN_USE
        - USER_ROLE_REQUIRED
        - DELETE_BLOCKED
        - VERSION_NOT_EDITABLE
        - VERSION_PUBLISHED
        - VERSION_HAS_INSTANCES
        - VERSION_VALIDATION_FAILED
        - PUBLISH_POINTER_CHANGED
        - DEFINITION_DISABLED
        - DEFINITION_NOT_PUBLISHED
        - EXTERNAL_DEPENDENCY_INVALID
        - TASK_ALREADY_COMPLETED
        - ACTION_NOT_ALLOWED_FOR_NODE
        - REVIEW_COMMENT_REQUIRED
        - INSTANCE_CONTENT_LOCKED
        - INSTANCE_NOT_REJECTED
        - INSTANCE_ALREADY_CLOSED
        - REPEAT_EDIT_FORBIDDEN
        - NO_FIELD_CHANGES
        - FIELD_REVISION_CONFLICT
        - ATTACHMENT_NOT_STAGED
        - ATTACHMENT_IN_USE
        - ATTACHMENT_LIMIT_EXCEEDED
        - INVALID_ATTACHMENT_TYPE
        - PDF_ATTACHMENT_REQUIRED
        - ATTACHMENT_RANGE_NOT_SATISFIABLE
        - INSUFFICIENT_STORAGE
        - OUTBOX_MESSAGE_NOT_RETRYABLE
        - EXPORT_NOT_READY
        - EXPORT_EXPIRED
        - RATE_LIMITED
        - INTERNAL_SERVER_ERROR
        - DOMAIN_AUTHENTICATION_UNAVAILABLE
        - AUTHENTICATION_MODE_CONFLICT
        - IMPERSONATION_NOT_ALLOWED
        - IMPERSONATION_TARGET_INVALID
        - IMPERSONATION_ALREADY_ACTIVE
    ValidationIssueDto:
      type: object
      required: [code, message]
      properties:
        path:
          type: string
          description: JSON Pointer 或稳定字段/节点路径
        code:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [error, warning]
          default: error
    PageMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    EnabledStatus:
      type: string
      enum: [enabled, disabled]
    AuthenticationMode:
      type: string
      enum: [domain, password]
      description: 普通用户默认 domain；系统内置超级管理员固定为 password
    UserRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        loginName:
          type: string
        email:
          type: string
          format: email
        departmentPath:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [loginName, password]
      properties:
        loginName:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 200
    SessionDto:
      type: object
      required: [user, operatorUser, roleIds, permissions, superAdmin, operatorSuperAdmin]
      properties:
        user:
          $ref: "#/components/schemas/UserDto"
        operatorUser:
          $ref: "#/components/schemas/UserDto"
        roleIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
        superAdmin:
          type: boolean
          description: 当前生效用户是否为超级管理员
        operatorSuperAdmin:
          type: boolean
          description: 建立登录会话的真实操作者是否为系统内置超级管理员
        impersonation:
          $ref: "#/components/schemas/ImpersonationContextDto"
        expiresAt:
          type: string
          format: date-time
    StartImpersonationRequest:
      type: object
      additionalProperties: false
      required: [targetUserId, reason]
      description: 目标用户认证由服务端明确跳过；请求不得包含目标用户密码或客户端控制的跳过认证开关。
      properties:
        targetUserId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 客户端自动生成的模拟身份切换来源说明，用于审计留痕
    ImpersonationContextDto:
      type: object
      required: [id, operatorUserId, targetUserId, reason, startedAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        operatorUserId:
          type: string
          format: uuid
        targetUserId:
          type: string
          format: uuid
        reason:
          type: string
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    CreateDomainUserRequest:
      type: object
      additionalProperties: false
      required: [loginName, name, email, departmentId, positionId, roleIds, authenticationMode, status]
      properties:
        loginName:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        departmentId:
          type: string
          format: uuid
        positionId:
          type: string
          format: uuid
        roleIds:
          type: array
          uniqueItems: true
          description: status=enabled 时至少包含一个启用角色；该跨字段约束由服务端校验。
          items:
            type: string
            format: uuid
        authenticationMode:
          type: string
          const: domain
        status:
          $ref: "#/components/schemas/EnabledStatus"
    CreatePasswordUserRequest:
      type: object
      additionalProperties: false
      required: [loginName, name, email, departmentId, positionId, roleIds, authenticationMode, initialPassword, status]
      properties:
        loginName:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        departmentId:
          type: string
          format: uuid
        positionId:
          type: string
          format: uuid
        roleIds:
          type: array
          uniqueItems: true
          description: status=enabled 时至少包含一个启用角色；该跨字段约束由服务端校验。
          items:
            type: string
            format: uuid
        authenticationMode:
          type: string
          const: password
        initialPassword:
          type: string
          minLength: 1
          maxLength: 200
          description: authenticationMode=password 时必填
        status:
          $ref: "#/components/schemas/EnabledStatus"
    CreateUserRequest:
      description: 启用账号必须至少分配一个启用角色；停用账号可暂时不分配角色，以便解除引用后删除。password 模式必须提交 initialPassword，domain 模式不得提交该字段。
      oneOf:
        - $ref: "#/components/schemas/CreateDomainUserRequest"
        - $ref: "#/components/schemas/CreatePasswordUserRequest"
      discriminator:
        propertyName: authenticationMode
        mapping:
          domain: "#/components/schemas/CreateDomainUserRequest"
          password: "#/components/schemas/CreatePasswordUserRequest"
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 后端结合用户当前状态校验登录方式变化；只有从 domain 切换到 password 时要求 newPassword，保持现有 password 模式不要求重复设置密码。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        departmentId:
          type: string
          format: uuid
        positionId:
          type: string
          format: uuid
        roleIds:
          type: array
          uniqueItems: true
          description: 更新后的账号如为 enabled，最终角色集合不得为空且至少包含一个启用角色。
          items:
            type: string
            format: uuid
        authenticationMode:
          $ref: "#/components/schemas/AuthenticationMode"
        newPassword:
          type: string
          minLength: 1
          maxLength: 200
          description: 仅从域登录切换到密码登录时使用，不返回、不展示已有密码
    SetStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      description: 将账号启用前，服务端必须确认账号至少具有一个启用角色，否则返回 409 USER_ROLE_REQUIRED。
      properties:
        status:
          $ref: "#/components/schemas/EnabledStatus"
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 1
          maxLength: 200
    UserDto:
