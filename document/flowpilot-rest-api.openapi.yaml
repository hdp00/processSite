        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Attachments]
      operationId: deleteStagedAttachment
      summary: 删除尚未被业务记录引用的暂存附件
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: 暂存附件已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /attachments/{attachmentId}/content:
    get:
      tags: [Attachments]
      operationId: downloadAttachment
      summary: 按实例数据范围校验后下载或内联预览附件
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
        - name: disposition
          in: query
          schema:
            type: string
            enum: [inline, attachment]
            default: attachment
      responses:
        "200":
          description: 附件二进制内容
          headers:
            Content-Disposition:
              description: 安全编码后的原始文件名
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /email-outbox:
    get:
      tags: [EmailOutbox]
      operationId: listEmailOutboxMessages
      summary: 管理员分页查询邮件投递状态
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EmailOutboxStatus"
        - name: instanceId
          in: query
          schema:
            type: string
            format: uuid
        - name: taskId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Outbox 分页结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailOutboxPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /email-outbox/{messageId}:
    get:
      tags: [EmailOutbox]
      operationId: getEmailOutboxMessage
      summary: 获取邮件投递详情和失败原因
      parameters:
        - $ref: "#/components/parameters/OutboxMessageId"
      responses:
        "200":
          description: Outbox 消息详情
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailOutboxMessageDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /email-outbox/{messageId}/retry:
    post:
      tags: [EmailOutbox]
      operationId: retryEmailOutboxMessage
      summary: 对失败或死信邮件安排一次重试
      parameters:
        - $ref: "#/components/parameters/OutboxMessageId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: 已重新排队
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailOutboxMessageDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: 分页查询不可变操作审计
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
        - name: aggregateType
          in: query
          schema:
            type: string
        - name: aggregateId
          in: query
          schema:
            type: string
            format: uuid
        - name: traceId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 审计分页结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /audit-events/{auditEventId}:
    get:
      tags: [Audit]
      operationId: getAuditEvent
      summary: 获取单条审计详情
      parameters:
        - $ref: "#/components/parameters/AuditEventId"
      responses:
        "200":
          description: 审计事件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /exports/process-instances:
    post:
      tags: [Exports]
      operationId: createProcessInstanceExport
      summary: 按当前查询范围创建异步 Excel 导出任务
      description: |
        请求保存查询快照和版本字段配置快照。导出包含当前数据范围内全部匹配记录，
        不受页面分页限制；只输出各实例锁定版本中 exportVisible=true 的系统及业务字段。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProcessInstanceExportRequest"
      responses:
        "202":
          description: 导出任务已排队，前端显示等待提示并轮询状态
          headers:
            Location:
              description: 导出任务查询地址
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJobDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /exports/{exportId}:
    get:
      tags: [Exports]
      operationId: getExportJob
      summary: 查询导出进度和结果
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: 导出任务状态
          headers:
            Retry-After:
              description: 未完成时建议下次轮询的秒数
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJobDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /exports/{exportId}/content:
    get:
      tags: [Exports]
      operationId: downloadExport
      summary: 下载已完成的 Excel 文件
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: Excel 文件
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: flowpilot_session
    mockBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "mock:<userId>"
      description: 仅供无后端浏览器原型和自动化测试使用，不能作为生产认证方案。

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Search:
      name: q
      in: query
      description: 去除首尾空格的关键词
      schema:
        type: string
        maxLength: 100
    DateFrom:
      name: dateFrom
      in: query
      required: true
      description: 查询起始日期，前端默认今天之前 30 天
      schema:
        type: string
        format: date
    DateTo:
      name: dateTo
      in: query
      required: true
      description: 查询结束日期，前端默认今天；不得早于 dateFrom
      schema:
        type: string
        format: date
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: GET 返回的强 ETag，例如 `"12"`
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 客户端生成的 UUID；同作用域至少保留 24 小时
      schema:
        type: string
        minLength: 16
        maxLength: 100
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PositionId:
      name: positionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkflowGroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DefinitionId:
      name: definitionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TimelineEntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OutboxMessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditEventId:
      name: auditEventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    ETag:
      description: 由资源 revision 生成的强 ETag
      schema:
        type: string
        pattern: '^"[0-9]+"$'

  responses:
    BadRequest:
      description: 请求语法、查询范围或媒体格式参数错误
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: 未登录或会话失效
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: 缺少页面/动作权限、流程资格或数据范围
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: 资源不存在，或为避免越权信息泄露而按不存在处理
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: 当前领域状态不允许该动作、幂等键冲突或字段并发冲突
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PreconditionFailed:
      description: If-Match 已过期
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    UnprocessableEntity:
      description: 领域字段校验未通过
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PreconditionRequired:
      description: 缺少必需的 If-Match
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    TooManyRequests:
      description: 请求过于频繁
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PayloadTooLarge:
      description: 文件超过字段或系统限制
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    UnsupportedMediaType:
      description: 文件内容类型不受支持
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    SavedProcessVersion:
      description: 版本分区已保存并自动重新校验
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SaveProcessVersionResponse"

  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
          example: /problems/task-already-completed
        title:
          type: string
          example: 任务已处理
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          $ref: "#/components/schemas/ProblemCode"
        traceId:
          type: string
        currentEtag:
          type: string
        retryAfterSeconds:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssueDto"
        currentResource:
          description: 冲突处理所需的最小当前资源快照
          type: object
          additionalProperties: true
    ProblemCode:
      type: string
      enum:
        - BAD_REQUEST
        - AUTHENTICATION_REQUIRED
        - INVALID_CREDENTIALS
        - PERMISSION_DENIED
        - DATA_SCOPE_DENIED
        - RESOURCE_NOT_FOUND
        - REVISION_MISMATCH
        - VALIDATION_FAILED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_REQUEST_IN_PROGRESS
        - IMMUTABLE_BUILTIN_RESOURCE
        - RESOURCE_IN_USE
        - DELETE_BLOCKED
        - VERSION_NOT_EDITABLE
        - VERSION_PUBLISHED
        - VERSION_HAS_INSTANCES
        - VERSION_VALIDATION_FAILED
        - PUBLISH_POINTER_CHANGED
        - DEFINITION_DISABLED
        - DEFINITION_NOT_PUBLISHED
        - EXTERNAL_DEPENDENCY_INVALID
        - TASK_ALREADY_COMPLETED
        - ACTION_NOT_ALLOWED_FOR_NODE
        - REVIEW_COMMENT_REQUIRED
        - INSTANCE_CONTENT_LOCKED
        - INSTANCE_NOT_REJECTED
        - INSTANCE_ALREADY_CLOSED
        - REPEAT_EDIT_FORBIDDEN
        - NO_FIELD_CHANGES
        - FIELD_REVISION_CONFLICT
        - ATTACHMENT_NOT_STAGED
        - ATTACHMENT_IN_USE
        - ATTACHMENT_LIMIT_EXCEEDED
        - INVALID_ATTACHMENT_TYPE
        - OUTBOX_MESSAGE_NOT_RETRYABLE
        - EXPORT_NOT_READY
        - EXPORT_EXPIRED
        - RATE_LIMITED
    ValidationIssueDto:
      type: object
      required: [code, message]
      properties:
        path:
          type: string
          description: JSON Pointer 或稳定字段/节点路径
        code:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [error, warning]
          default: error
    PageMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    EnabledStatus:
      type: string
      enum: [enabled, disabled]
    UserRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        loginName:
          type: string
        email:
          type: string
          format: email
        departmentPath:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [loginName, password]
      properties:
        loginName:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 200
    SessionDto:
      type: object
      required: [user, roleIds, permissions, superAdmin]
      properties:
        user:
          $ref: "#/components/schemas/UserDto"
        roleIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
        superAdmin:
          type: boolean
        expiresAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [loginName, name, email, departmentId, positionId, roleIds, initialPassword, status]
      properties:
        loginName:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        departmentId:
          type: string
          format: uuid
        positionId:
          type: string
          format: uuid
        roleIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        initialPassword:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: "#/components/schemas/EnabledStatus"
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        departmentId:
          type: string
          format: uuid
        positionId:
          type: string
          format: uuid
        roleIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    SetStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/EnabledStatus"
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 1
          maxLength: 200
    UserDto:
      type: object
      required: [id, revision, loginName, name, email, status, department, position, roles, superAdmin, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        loginName:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/EnabledStatus"
        department:
          $ref: "#/components/schemas/DepartmentRef"
        position:
          $ref: "#/components/schemas/PositionRef"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleRef"
        superAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserDto"
        meta:
          $ref: "#/components/schemas/PageMeta"
    DepartmentRef:
      type: object
      required: [id, name, path]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        path:
          type: string
    PositionRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    RoleRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    UpsertDepartmentRequest:
      type: object
      additionalProperties: false
      required: [name, sortOrder, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        parentId:
          type: string
          format: uuid
        sortOrder:
          type: integer
        status:
          $ref: "#/components/schemas/EnabledStatus"
        description:
          type: string
          maxLength: 500
    DepartmentDto:
      type: object
      required: [id, revision, code, name, path, level, sortOrder, status, userCount, children]
      properties:
        id:
          type: string
          format: uuid
        revision:
          type: integer
        code:
          type: string
          readOnly: true
        name:
          type: string
        parentId:
          type: string
          format: uuid
        path:
          type: string
        level:
          type: integer
          minimum: 1
          maximum: 2
        sortOrder:
          type: integer
        status:
          $ref: "#/components/schemas/EnabledStatus"
        description:
          type: string
        userCount:
          type: integer
          minimum: 0
        children:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentDto"
    UpsertPositionRequest:
      type: object
      additionalProperties: false
      required: [name, sortOrder, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        sortOrder:
          type: integer
        status:
          $ref: "#/components/schemas/EnabledStatus"
        description:
          type: string
          maxLength: 500
    PositionDto:
      type: object
      required: [id, revision, name, sortOrder, status, userCount]
      properties:
        id:
          type: string
          format: uuid
        revision:
          type: integer
        name:
          type: string
