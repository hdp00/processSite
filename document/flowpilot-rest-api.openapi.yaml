  /attachments:
    post:
      tags: [Attachments]
      operationId: uploadAttachment
      summary: 上传暂存附件
      description: |
        仅创建暂存文件与元数据，不直接修改流程表单。正式引用必须随实例创建、表单保存、
        重新提交或任务决策原子提交。启用 PDF 展示的字段由服务端强制最多一个 attachmentId，
        新引用替换旧引用；旧物理文件仅在确认无其他引用后异步清理。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                definitionId:
                  type: string
                  description: 发起前暂存时必填，用于锁定字段策略
                versionId:
                  type: string
                  description: 发起前暂存时必填，不允许回退当前发布版本
                instanceId:
                  type: string
                  description: 已创建实例编辑时使用；与 definitionId/versionId 二选一
                fieldId:
                  type: string
                  description: 表单附件字段稳定标识
                purpose:
                  type: string
                  enum: [form-field, free-reply]
      responses:
        "201":
          description: 附件已暂存
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "507":
          $ref: "#/components/responses/InsufficientStorage"

